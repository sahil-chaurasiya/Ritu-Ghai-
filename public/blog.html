<html class="no-js" lang="en">
<!--<![endif]-->
<head>
  <script src="/assets/scripts/navbar.js" defer></script>
  <meta charset="utf-8">
  <!--[if IE]><meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1"><![endif]-->
  <title>Blog — Ritu Ghai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="/assets/images/favicon.ico"/>
  <link href="/assets/styles/font-awesome.min.css" rel="stylesheet"/>
  <link href="/assets/pe-icon-7-stroke/css/pe-icon-7-stroke.css" rel="stylesheet"/>
  <link href="/assets/pe-icon-7-stroke/css/helper.css" rel="stylesheet"/>
  <link href="/assets/styles/minimal-menu.css" rel="stylesheet"/>
  <link href="/assets/styles/flat-form.css" rel="stylesheet"/>
  <link href="/assets/styles/fancySelect.css" rel="stylesheet"/>
  <link href="/assets/styles/jquery.fancybox.css" rel="stylesheet"/>
  <link href="/assets/styles/allinone_bannerRotator.css" rel="stylesheet"/>
  <link href="/assets/styles/owl.carousel.css" rel="stylesheet"/>
  <link href="/assets/styles/owl.theme.default.min.css" rel="stylesheet"/>
  <link href="/assets/styles/styles.css" rel="stylesheet"/>
  <script src="/assets/scripts/libs/prefixfree.min.js"></script>
  <script src="/assets/scripts/libs/modernizr.js"></script>
  <style>
    .blog-loading { text-align:center; padding:60px 0; color:#999; font-size:14px; letter-spacing:1px; }
    .blog-empty   { text-align:center; padding:60px 0; color:#999; font-size:14px; letter-spacing:1px; }
    .post-item .post-cover { width:100%; max-height:320px; object-fit:cover; margin-bottom:16px; }
    .post-item .post-meta-tags { margin-top:8px; }
    .post-item .post-meta-tags a {
      display:inline-block; background:#f4ece5; color:#44332B;
      font-size:10px; letter-spacing:1px; padding:3px 8px; margin:2px 2px 2px 0;
      border-radius:2px; text-decoration:none; text-transform:uppercase;
    }
    .post-item .post-meta-tags a:hover { background:#44332B; color:#fff; }
  </style>
</head>
<body>
<div class="main">
  <div class="container">
    <div class="row">
      <div class="col-md-9">
        <div class="main-content">

          <!-- Loading state -->
          <div id="blog-loading" class="blog-loading">
            <i class="fa fa-spinner fa-spin"></i> Loading posts…
          </div>

          <!-- Blog list -->
          <div class="list-posts" id="blog-list" style="display:none;"></div>

          <!-- Empty state -->
          <div id="blog-empty" class="blog-empty" style="display:none;">
            No blog posts yet. Check back soon!
          </div>

          <!-- Pagination -->
          <nav class="pagination" id="blog-pagination" style="display:none;">
            <ul class="page-numbers" id="pagination-list"></ul>
          </nav>

        </div><!-- /.main-content -->
      </div>

      <div class="col-md-3">
        <div class="sidebar">
          <aside class="widget">
            <h4 class="widget-title">GET CONNECTED</h4>
            <ul class="list-social-2">
              <li><a href="#" class="facebook"><i class="fa fa-facebook"></i></a></li>
              <li><a href="#" class="twitter"><i class="fa fa-twitter"></i></a></li>
              <li><a href="#" class="instagram"><i class="fa fa-instagram"></i></a></li>
              <li><a href="https://youtube.com" target="_blank" class="youtube"><i class="fa fa-youtube-play"></i></a></li>
            </ul>
          </aside>
          <aside class="widget">
            <h4 class="widget-title">SEARCH THE BLOG</h4>
            <form action="#" class="search-form" id="blog-search-form">
              <input class="input-form" type="text" id="blog-search-input" placeholder="LET'S SEARCH" />
              <button type="submit"><i class="pe-7s-search"></i></button>
            </form>
          </aside>
          <aside class="widget">
            <h4 class="widget-title">POPULAR TAGS</h4>
            <ul class="list-tags" id="tag-list">
              <li><a href="blog.html">FASHION</a></li>
              <li><a href="blog.html">LEHENGA</a></li>
              <li><a href="blog.html">SAREE</a></li>
              <li><a href="blog.html">BRIDAL</a></li>
              <li><a href="blog.html">STYLING</a></li>
            </ul>
          </aside>
        </div><!-- /.sidebar -->
      </div>
    </div>
  </div>
</div><!-- /.main -->

<script src="/assets/scripts/libs/jquery-1.11.2.min.js"></script>
<script src="/assets/scripts/libs/bootstrap.min.js"></script>
<script src="/assets/scripts/functions.js"></script>
<script>
(function () {
  const LIMIT = 6;
  let currentPage = 1;
  let currentTag  = '';

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderPost(p) {
    const img = p.coverImage
      ? `<div class="post-main-img"><img class="img-responsive post-cover" src="${p.coverImage}" alt="${p.title}"/></div>`
      : '';
    const tags = (p.tags || []).map(t =>
      `<a href="blog.html?tag=${encodeURIComponent(t)}">${t.toUpperCase()}</a>`
    ).join('');
    return `
      <div class="post-item">
        <h3 class="post-title"><a href="/single-post.html?slug=${p.slug}">${p.title}</a></h3>
        <div class="post-info">
          <span><a href="#"><i class="pe-7s-users"></i> ${p.author || 'ADMIN'}</a></span>
          <span><a href="#"><i class="pe-7s-clock"></i> ${formatDate(p.createdAt)}</a></span>
        </div>
        ${img}
        <div class="post-excerpt">${p.excerpt || ''}</div>
        ${tags ? `<div class="post-meta-tags">${tags}</div>` : ''}
        <a href="/single-post.html?slug=${p.slug}" class="readmore">CONTINUE READING</a>
      </div>`;
  }

  function renderPagination(total, page) {
    const pages = Math.ceil(total / LIMIT);
    if (pages <= 1) { $('#blog-pagination').hide(); return; }
    let html = '';
    if (page > 1) html += `<li><a href="#" data-page="${page - 1}">&laquo;</a></li>`;
    for (let i = 1; i <= pages; i++) {
      if (i === page) html += `<li><span class="current">${i}</span></li>`;
      else html += `<li><a href="#" data-page="${i}">${i}</a></li>`;
    }
    if (page < pages) html += `<li><a href="#" data-page="${page + 1}">&raquo;</a></li>`;
    $('#pagination-list').html(html);
    $('#blog-pagination').show();
  }

  function loadBlogs(page, tag) {
    $('#blog-loading').show();
    $('#blog-list').hide();
    $('#blog-empty').hide();
    $('#blog-pagination').hide();

    let url = `/api/blogs?limit=${LIMIT}&page=${page}`;
    if (tag) url += `&tag=${encodeURIComponent(tag)}`;

    $.getJSON(url, function (data) {
      $('#blog-loading').hide();
      if (!data.blogs || data.blogs.length === 0) {
        $('#blog-empty').show();
        return;
      }
      $('#blog-list').html(data.blogs.map(renderPost).join('')).show();
      renderPagination(data.total, page);
    }).fail(function () {
      $('#blog-loading').hide();
      $('#blog-empty').text('Failed to load posts. Please try again.').show();
    });
  }

  // Pagination click
  $(document).on('click', '#pagination-list a', function (e) {
    e.preventDefault();
    const p = parseInt($(this).data('page'));
    if (p) { currentPage = p; loadBlogs(currentPage, currentTag); $('html,body').animate({scrollTop:0},300); }
  });

  // Search
  $('#blog-search-form').on('submit', function (e) {
    e.preventDefault();
    // Simple client-side filter by tag/keyword via reload
    const q = $('#blog-search-input').val().trim();
    if (q) { currentTag = q; currentPage = 1; loadBlogs(1, q); }
  });

  // Read tag from URL
  const urlParams = new URLSearchParams(window.location.search);
  currentTag = urlParams.get('tag') || '';
  if (currentTag) $('#blog-search-input').val(currentTag);

  loadBlogs(currentPage, currentTag);
})();
</script>
</body>
</html>
