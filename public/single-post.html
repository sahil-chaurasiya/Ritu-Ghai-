<!DOCTYPE html>
<!--[if lt IE 7 ]> <html class="ie ie6 ie-lt10 ie-lt9 ie-lt8 ie-lt7 no-js" lang="en"> <![endif]-->

<html class="no-js" lang="en">
<!--<![endif]-->
<head>
  <script src="/assets/scripts/navbar.js" defer></script>
  <meta charset="utf-8">
  <title id="page-title">Blog Post — Ritu Ghai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="/assets/images/favicon.ico"/>
  <link href="/assets/styles/font-awesome.min.css" rel="stylesheet"/>
  <link href="/assets/pe-icon-7-stroke/css/pe-icon-7-stroke.css" rel="stylesheet"/>
  <link href="/assets/pe-icon-7-stroke/css/helper.css" rel="stylesheet"/>
  <link href="/assets/styles/minimal-menu.css" rel="stylesheet"/>
  <link href="/assets/styles/flat-form.css" rel="stylesheet"/>
  <link href="/assets/styles/fancySelect.css" rel="stylesheet"/>
  <link href="/assets/styles/jquery.fancybox.css" rel="stylesheet"/>
  <link href="/assets/styles/owl.carousel.css" rel="stylesheet"/>
  <link href="/assets/styles/owl.theme.default.min.css" rel="stylesheet"/>
  <link href="/assets/styles/styles.css" rel="stylesheet"/>
  <script src="/assets/scripts/libs/prefixfree.min.js"></script>
  <script src="/assets/scripts/libs/modernizr.js"></script>
  <style>
    .post-cover-full { width:100%; max-height:420px; object-fit:cover; margin-bottom:24px; }
    .post-body-content p { margin-bottom:16px; line-height:1.8; }
    .post-tags { margin-top:20px; }
    .post-tags a {
      display:inline-block; background:#f4ece5; color:#44332B;
      font-size:10px; letter-spacing:1px; padding:4px 10px; margin:3px 3px 3px 0;
      border-radius:2px; text-decoration:none; text-transform:uppercase;
    }
    .post-tags a:hover { background:#44332B; color:#fff; }
    .back-to-blog { display:inline-block; margin-bottom:24px; font-size:12px; letter-spacing:1px; color:#44332B; text-decoration:none; text-transform:uppercase; }
    .back-to-blog i { margin-right:6px; }
    .post-loading, .post-error { text-align:center; padding:80px 0; color:#999; font-size:14px; letter-spacing:1px; }
  </style>
</head>
<body>
<div class="main">
  <div class="container">
    <div class="row">
      <div class="col-md-9">
        <div class="main-content">

          <a href="/blog.html" class="back-to-blog"><i class="fa fa-arrow-left"></i> Back to Blog</a>

          <div id="post-loading" class="post-loading">
            <i class="fa fa-spinner fa-spin"></i> Loading post…
          </div>

          <div id="post-content" style="display:none;">
            <div class="post-item">
              <h1 class="post-title" id="post-title"></h1>
              <div class="post-info">
                <span><a href="#"><i class="pe-7s-users"></i> <span id="post-author"></span></a></span>
                <span><a href="#"><i class="pe-7s-clock"></i> <span id="post-date"></span></a></span>
              </div>
              <div id="post-cover-wrap"></div>
              <div class="post-content post-body-content" id="post-body"></div>
              <div class="post-tags" id="post-tags"></div>
            </div>
          </div>

          <div id="post-error" class="post-error" style="display:none;">
            Post not found. <a href="/blog.html">Go back to the blog.</a>
          </div>

        </div>
      </div>

      <div class="col-md-3">
        <div class="sidebar">
          <aside class="widget">
            <h4 class="widget-title">GET CONNECTED</h4>
            <ul class="list-social-2">
              <li><a href="#" class="facebook"><i class="fa fa-facebook"></i></a></li>
              <li><a href="#" class="twitter"><i class="fa fa-twitter"></i></a></li>
              <li><a href="#" class="instagram"><i class="fa fa-instagram"></i></a></li>
              <li><a href="https://youtube.com" target="_blank" class="youtube"><i class="fa fa-youtube-play"></i></a></li>
            </ul>
          </aside>
          <aside class="widget">
            <h4 class="widget-title">RECENT POSTS</h4>
            <ul class="list-comments" id="recent-posts"></ul>
          </aside>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/scripts/libs/jquery-1.11.2.min.js"></script>
<script src="/assets/scripts/libs/bootstrap.min.js"></script>
<script src="/assets/scripts/functions.js"></script>
<script>
(function () {
  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  const slug = new URLSearchParams(window.location.search).get('slug');

  if (!slug) {
    $('#post-loading').hide();
    $('#post-error').show();
    return;
  }

  // Load the single post
  $.getJSON('/api/blogs/' + slug, function (data) {
    $('#post-loading').hide();
    if (!data.success || !data.blog) { $('#post-error').show(); return; }

    const p = data.blog;
    document.title = p.title + ' — Ritu Ghai';
    $('#post-title').text(p.title);
    $('#post-author').text((p.author || 'Admin').toUpperCase());
    $('#post-date').text(formatDate(p.createdAt));

    if (p.coverImage) {
      $('#post-cover-wrap').html(`
        <div class="post-main-img">
          <img class="img-responsive post-cover-full" src="${p.coverImage}" alt="${p.title}"/>
        </div>`);
    }

    // Render content — support plain text or basic HTML
    $('#post-body').html(p.content);

    if (p.tags && p.tags.length) {
      const tagHtml = p.tags.map(t =>
        `<a href="/blog.html?tag=${encodeURIComponent(t)}">${t.toUpperCase()}</a>`
      ).join('');
      $('#post-tags').html(tagHtml);
    }

    $('#post-content').show();
  }).fail(function () {
    $('#post-loading').hide();
    $('#post-error').show();
  });

  // Load recent posts
  $.getJSON('/api/blogs?limit=5', function (data) {
    if (!data.blogs) return;
    const html = data.blogs.map(p =>
      `<li class="pe-7s-comment"><a href="/single-post.html?slug=${p.slug}">${p.title}</a></li>`
    ).join('');
    $('#recent-posts').html(html);
  });
})();
</script>
</body>
</html>
