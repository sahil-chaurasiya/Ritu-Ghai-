<div class="log-reg-content">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <form action="#" class="login-form">
                            <h3>LOGIN</h3>
                            <label for="your_id">USERNAME OR EMAIL ADDRESS*</label>
                            <input class="input-form" type="text" id="your_id" />
                            <label for="your_password">YOUR PASSWORD*</label>
                            <input class="input-form" type="password" id="your_password" />
                            <button class="submit-btn" type="submit">LOGIN</button>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox"> REMEMBER ME?
                                </label>
                            </div>
                            <a href="#">LOST YOUR PASSWORD?</a>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <form action="#" class="register-form">
                            <h3>REGISTER</h3>
                            <h5>IF YOU DON’T HAVE AN ACCOUNT, REGISTER NOW!</h5>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox"> I ACCEPT THE TERMS AND CONDITIONS, INCLUDING THE PRIVACY POLICY
                                </label>
                            </div>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox"> I WANT ZORKA TO SEND ME NEWS AND UPDATES BY EMAIL
                                </label>
                            </div>
                            <button class="submit-btn" type="submit">REGISTER</button>
                        </form>
                    </div>
                </div>
