<html class="no-js" lang="en">
    <!--<![endif]-->
    <head>
    <script src="/assets/scripts/navbar.js" defer></script>
        <meta charset="utf-8">
        <!--[if IE]>
        <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
        <![endif]-->
        <title>Shop with sidebar</title>
        <meta name="keywords" content="keywords" />
        <meta name="description" content="description" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--[if LTE IE 8]>
        <![endif]-->
            <link rel="shortcut icon" href="/assets/images/favicon.ico"/>
        <link href="/assets/styles/font-awesome.min.css" rel="stylesheet"/>
        <link href="/assets/pe-icon-7-stroke/css/pe-icon-7-stroke.css" rel="stylesheet"/>
        <link href="/assets/pe-icon-7-stroke/css/helper.css" rel="stylesheet"/>
        <link href="/assets/styles/minimal-menu.css" rel="stylesheet"/>
        <link href="/assets/styles/flat-form.css" rel="stylesheet"/>
        <link href="/assets/styles/fancySelect.css" rel="stylesheet"/>
        <link href="/assets/styles/jquery.fancybox.css" rel="stylesheet"/>
        <link href="/assets/styles/allinone_bannerRotator.css" rel="stylesheet"/>
        <link href="/assets/styles/owl.carousel.css" rel="stylesheet"/>
        <link href="/assets/styles/owl.theme.default.min.css" rel="stylesheet"/>
        <link href="/assets/styles/styles.css" rel="stylesheet"/>
        <script src="/assets/scripts/libs/prefixfree.min.js"></script>
        <script src="/assets/scripts/libs/modernizr.js"></script>
    </head>
    <body>
<div class="main">
            <div class="container">
                <div class="header-page">
                    <h1>SHOP</h1>
                </div>
                <!-- /.header-page -->
                <div class="row">
                    <div class="col-md-3">
                        <div class="sidebar">
                            <aside class="widget">
                                <h4 class="widget-title">FILTER BY PRICE</h4>
                                <div class="options-price">
                                    <div id="price-slider"></div>
                                    <div class="price-range">
                                        <label for="amount">PRICE:</label>
                                        <input type="text" id="amount" readonly />
                                    </div>
                                    <button class="filter-price-btn">Filter</button>
                                </div>
                            </aside>
                                                        <aside class="widget">
                                <h4 class="widget-title">CATEGORY</h4>
                                <ul class="ul-sidebar" id="sidebar-categories">
                                    <li><a href="#" data-category="all" class="active">ALL PRODUCTS</a></li>
                                </ul>
                            </aside>
                            <aside class="widget">
                                <h4 class="widget-title">FILTER BY SIZE</h4>
                                <ul class="ul-sidebar" id="sidebar-sizes" style="list-style:none;padding:0;margin:0;">
                                    <!-- Populated dynamically by shop-products.js -->
                                </ul>
                            </aside>
                        </div>
                        <!-- /.sidebar -->
                    </div>
                    <div class="col-md-9">
                        <div class="main-content">
                            <div class="top-products">
                                <div class="showing-results">
                                    LOADING...
                                </div>
                                <div class="sortby">
                                    <select class="custom-select">
                                        <option value="0">DEFAULT SORTING</option>
                                        <option value="1">Price: Lowest First</option>
                                        <option value="2">Price: Highest First</option>
                                    </select>
                                </div>
                            </div>
                            <div class="box-product row">
                        <!-- Products loaded dynamically by products.js -->
                    </div>
                            <!-- /.box-product -->
                            <nav class="pagination">
                                <ul class="page-numbers">
                                    <li><a href="#">1</a></li>
                                    <li><span class="current">2</span></li>
                                    <li><a href="#">3</a></li>
                                    <li><a href="#">4</a></li>
                                    <li><a href="#">5</a></li>
                                    <li><a href="#">6</a></li>
                                    <li><a class="last " href="#"><i class="fa fa-angle-double-right"></i></a></li>
                                </ul>
                            </nav>
                            <!-- /.pagination -->
                        </div>
                        <!-- /.main-content -->
                    </div>
                </div>
            </div>
        </div>
        <!-- /.main -->
        <script src="/assets/scripts/libs/jquery-1.11.2.min.js"></script>
        <script src="/assets/scripts/libs/jquery-ui-1.11.4/jquery-ui.min.js"></script>
        <script src="/assets/scripts/libs/jquery.easing.1.3.js"></script>
        <script src="/assets/scripts/libs/bootstrap.min.js"></script>
        <script src="/assets/scripts/libs/fancySelect.js"></script>
        <script src="/assets/scripts/libs/jquery.fancybox.pack.js"></script>
        <script src="/assets/scripts/libs/jquery.ui.touch-punch.min.js"></script>
        <script src="/assets/scripts/libs/jquery.mousewheel.min.js"></script>
        <script src="/assets/scripts/libs/allinone_bannerRotator.js"></script>
        <script src="/assets/scripts/libs/owl.carousel.min.js"></script>
        <script src="/assets/scripts/libs/jquery.countdown.min.js"></script>
        <script src="/assets/scripts/libs/jquery.waypoints.min.js"></script>
        <script src="/assets/scripts/functions.js"></script>
        <script src="/assets/scripts/cart.js"></script>
        <script src="/assets/scripts/shop-products.js"></script>
        <script>
          (function() {
            var cat = new URLSearchParams(window.location.search).get('category');
            if (cat) {
              var h1 = document.querySelector('.header-page h1');
              if (h1) h1.textContent = cat.toUpperCase();
              document.title = cat + ' — Ritu Ghai';
            }
          })();
        </script>
</body>
</html>
