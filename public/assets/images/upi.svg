<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 36">
  <!-- Background pill -->
  <rect width="100" height="36" rx="4" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>

  <!-- "UPI" text in official colors -->
  <text x="10" y="26" font-family="Arial Black, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#097939">U</text>
  <text x="29" y="26" font-family="Arial Black, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#ed752e">P</text>
  <text x="48" y="26" font-family="Arial Black, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#097939">I</text>

  <!-- Arrow up-right (orange) -->
  <polyline points="68,24 68,10 82,10" fill="none" stroke="#ed752e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="82,5 90,10 82,15" fill="#ed752e"/>

  <!-- Arrow down-left (green) -->
  <polyline points="90,12 90,26 76,26" fill="none" stroke="#097939" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="76,21 68,26 76,31" fill="#097939"/>
</svg>
