    <style>
      /* ── Custom product tabs (replaces easyResponsiveTabs on dynamic pages) ── */
      #sp-tabs .resp-tabs-list {
        list-style: none;
        padding: 0;
        margin: 0 0 0 0;
        border-bottom: 2px solid #e8e8e8;
        display: flex;
        gap: 0;
      }
      #sp-tabs .resp-tabs-list li {
        font-family: Montserrat, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #999;
        padding: 14px 24px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: color 0.2s, border-color 0.2s;
        white-space: nowrap;
      }
      #sp-tabs .resp-tabs-list li:hover {
        color: #25282c;
      }
      #sp-tabs .resp-tabs-list li.resp-tab-active {
        color: #25282c;
        border-bottom: 2px solid #25282c;
      }
      #sp-tabs .resp-tabs-container > div {
        padding: 28px 4px 12px;
        font-family: Georgia, serif;
        font-size: 14px;
        line-height: 1.8;
        color: #555;
      }
    </style>
    </head>
    <body>
<div class="main">
            <div class="container">
                <div class="main-content">
                    <div class="product">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="images">
                                    <div id="product-showcase">
                                        <div class="gallery">
                                            <div class="full">
                                                <img src="" alt="" style="min-height:400px;background:#f5f5f5;" />
                                                <a href="#" class="details"><i class="pe-7s-search"></i></a>
                                            </div>
                                            <div class="previews">
                                                <div class="box-content">
                                                </div>
                                                <div class="nav">
                                                    <span class="prev"><i class="fa fa-angle-left"></i></span>
                                                    <span class="next"><i class="fa fa-angle-right"></i></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <nav class="breadcrumb">
                                    <a href="index.html">HOME</a> <i class="fa fa-angle-right"></i> <a href="shop-fullwidth.html">MAIN MENU</a> <i class="fa fa-angle-right"></i> <span></span>
                                </nav>
                                <!-- /.breadcrumb -->
                                <div class="summary">
                                    <h2 class="product-name" style="color:#ccc;min-height:1.2em;">Loading…</h2>
                                    <div class="product-statistic">
                                        <span class="review-count"></span>
                                        <span class="review-star-read star-rating" data-score="0"></span>
                                    </div>
                                    <div class="price">
                                    </div>
                                    <div class="short-desc">
                                    </div>
                                    <div class="product-action">
                                        <div class="clearfix">
                                            <div class="quantity">
                                                <button class="minus-btn"><i class="fa fa-minus"></i></button>
                                                <input type="text" value="1" />
                                                <button class="plus-btn"><i class="fa fa-plus"></i></button>
                                            </div>
                                            <button type="submit" class="add-to-cart-btn">ADD TO CART</button>
                                        </div>
                                        <a href="#" class="wishlist-link"><i class="pe-7s-like"></i>ADD TO WISHLIST</a>
                                    </div>
                                    <ul class="ul-product">
                                        <li></li>
                                        <li></li>
                                    </ul>
                                    <div class="share-this">
                                        <h4>SHARE THIS:</h4>
                                        <ul class="list-social-2">
                                            <li><a href="#" class="facebook"><i class="fa fa-facebook"></i></a></li>
                                            <li><a href="#" class="twitter"><i class="fa fa-twitter"></i></a></li>
                                            <li><a href="#" class="instagram"><i class="fa fa-instagram"></i></a></li>
                                            <li><a href="#" class="vk"><i class="fa fa-vk"></i></a></li>
                                        </ul>
                                        <!-- /.list-social-2 -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="product-tabs" id="sp-tabs">
                            <ul class="resp-tabs-list hor_1">
                                <li>DESCRIPTION</li>
                                <li>ADDITIONAL INFORMATION</li>
                                <li id="tab-reviews-label">REVIEWS (0)</li>
                            </ul>
                            <div class="resp-tabs-container hor_1">
                                <!-- Tab 1: Description -->
                                <div id="tab-description">
                                    <p style="color:#aaa;font-style:italic;">Loading description…</p>
                                </div>
                                <!-- Tab 2: Additional Information -->
                                <div id="tab-additional-info">
                                    <p style="color:#aaa;font-style:italic;">Loading additional information…</p>
                                </div>
                                <!-- Tab 3: Reviews -->
                                <div id="tab-reviews">
                                    <div class="comments-area">
                                        <p class="comment-count" id="review-count-label">0 COMMENTS</p>
                                        <ol class="comment-list media-list" id="review-list"></ol>
                                        <div class="comment-respond pe-7s-user">
                                            <form id="review-form" class="comment-form">
                                                <div class="wrap-rating">
                                                    <h4>YOUR RATING: </h4>
                                                    <span class="review-star star-rating" id="review-star-input" data-score="0"></span>
                                                    <input type="hidden" id="review-rating-val" value="0" />
                                                </div>
                                                <div class="wrap-textarea">
                                                    <textarea class="textarea-form" id="review-body" placeholder="YOUR REVIEW*"></textarea>
                                                </div>
                                                <input class="input-form" type="text" id="review-name" placeholder="YOUR NAME*" />
                                                <input class="input-form" type="email" id="review-email" placeholder="YOUR EMAIL*" />
                                                <button type="submit">ADD REVIEW</button>
                                                <p id="review-msg" style="margin-top:10px;font-size:12px;font-family:Montserrat,sans-serif;letter-spacing:1px;"></p>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- /.product-tabs -->
                    </div>
                    <!-- /.product -->
                    <div class="related-products">
                        <h3>RELATED PRODUCTS</h3>
                        <div class="box-content">
                            <div class="showcase">
                                <div class="row">
                                    <div class="box-product">
                                        <!-- Dynamically loaded by single-product.js -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="nav">
                            <span class="prev"><i class="fa fa-angle-left"></i></span>
                            <span class="next"><i class="fa fa-angle-right"></i></span>
                        </div>
                    </div>
                    <!-- /.related-products -->
                </div>
                <!-- /.main-content -->
            </div>
        </div>
        <!-- /.main -->

        <script src="/assets/scripts/libs/owl.carousel.min.js"></script>
        <script src="/assets/scripts/libs/jquery.countdown.min.js"></script>
        <script src="/assets/scripts/libs/jquery.waypoints.min.js"></script>
        <script src="/assets/scripts/functions.js"></script>
        <script src="/assets/scripts/cart.js"></script>
        <script src="/assets/scripts/single-product.js"></script>
</body>
