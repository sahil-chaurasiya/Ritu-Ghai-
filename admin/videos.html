<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Videos — Admin</title>
  <link rel="stylesheet" href="admin.css"/>
  <style>
    .vid-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .vid-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .vid-card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .vid-card-body { padding: 10px 12px; }
    .vid-card-body p {
      font-size: 12px;
      color: #555;
      margin: 0 0 4px;
      font-family: 'Montserrat', sans-serif;
      word-break: break-all;
    }
    .vid-card-actions { display: flex; gap: 6px; margin-top: 8px; }
    .vid-inactive-badge {
      position: absolute; top: 8px; right: 8px;
      background: #e74c3c; color: #fff;
      font-size: 10px; padding: 2px 6px;
      border-radius: 3px; font-family: Montserrat, sans-serif; letter-spacing: 1px;
    }
    .upload-box {
      background: #fff; border: 2px dashed #ddd;
      border-radius: 6px; padding: 30px;
      text-align: center; margin-bottom: 16px; transition: border-color .2s;
    }
    .upload-box:hover { border-color: #aaa; }
    .upload-box label {
      display: block; font-family: Montserrat, sans-serif;
      font-size: 12px; letter-spacing: 1px; color: #555; margin-bottom: 10px;
    }
    .form-row {
      display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .form-row input[type="text"],
    .form-row input[type="number"],
    .form-row input[type="url"] {
      flex: 1; min-width: 180px; padding: 8px 12px;
      border: 1px solid #ddd; font-family: Montserrat, sans-serif;
      font-size: 12px; letter-spacing: 1px;
    }
    #upload-status {
      margin-top: 10px; font-family: Montserrat, sans-serif;
      font-size: 12px; letter-spacing: 1px;
    }
    #upload-status.success { color: #27ae60; }
    #upload-status.error   { color: #e74c3c; }
    .empty-state {
      text-align: center; padding: 60px 20px; color: #aaa;
      font-family: Montserrat, sans-serif; font-size: 12px; letter-spacing: 1px;
    }
    #upload-progress {
      width: 100%; height: 4px; background: #eee;
      border-radius: 2px; margin-top: 10px; display: none;
    }
    #upload-progress-bar {
      height: 100%; background: #44332B;
      border-radius: 2px; width: 0%; transition: width 0.2s;
    }

    /* ─── Mobile ─── */
    @media (max-width:600px) { .vid-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width:400px) { .vid-grid { grid-template-columns: 1fr; } }
    @media (max-width:768px) { .form-row { flex-direction:column; } }
    @media (max-width:768px) { .upload-box { padding: 18px; } }
  </style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar">
    <div class="sidebar-logo"><h1>Ritu Ghai</h1><p>Admin Panel</p></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="products.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Products
      </a>
      <a href="add-product.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Add Product
      </a>
      <a href="blogs.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Blog Posts

      <a href="add-blog.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        New Blog Post
      </a>
      <a href="customer-diaries.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>

      </a>
      <a href="videos.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>

    <div class="sidebar-footer">
      <p>Logged in as <strong id="adminUser">Admin</strong></p>

  <main class="main-content">
    <div class="topbar">
      <h2>Videos</h2>
      <div class="topbar-right"><span id="video-count" style="font-size:13px;color:#888;"></span></div>
    </div>

    <div class="card" style="margin-bottom:24px;">
      <div class="card-header"><h3>Upload Video</h3></div>
      <div style="padding:20px;">
        <div class="upload-box">
          <label for="video-file">Click to choose a video file (MP4, MOV, WebM — max 200MB)</label>
          <input type="file" id="video-file" accept="video/*" style="display:block;margin:0 auto;cursor:pointer;font-family:Montserrat,sans-serif;font-size:12px;"/>
        </div>
        <div class="form-row">
          <input type="url" id="video-link" placeholder="Click-through link URL (e.g. your Instagram reel link)" style="flex:2;"/>
        </div>
        <div class="form-row">
          <input type="text" id="video-caption" placeholder="Caption (optional)" maxlength="100"/>
          <input type="number" id="video-order" placeholder="Display order (0 = first)" min="0" value="0" style="max-width:180px;"/>
        </div>
        <button class="btn btn-primary" onclick="uploadVideo()">Upload Video</button>
        <div id="upload-progress"><div id="upload-progress-bar"></div></div>
        <div id="upload-status"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>All Videos</h3>
        <small style="color:#aaa;font-size:11px;letter-spacing:1px;">Videos autoplay muted on the homepage</small>
      </div>
      <div id="vid-grid" class="vid-grid">
        <div class="empty-state" id="vid-loading">Loading...</div>
      </div>
    </div>
  </main>
</div>

<script src="admin-auth.js"></script>
<script>
  if (!AdminAuth.requireAuth()) throw new Error('Unauthorized');

  async function uploadVideo() {
    var fileInput = document.getElementById('video-file');
    var linkUrl   = document.getElementById('video-link').value.trim();
    var caption   = document.getElementById('video-caption').value.trim();
    var order     = document.getElementById('video-order').value || '0';
    var statusEl  = document.getElementById('upload-status');
    var progressWrap = document.getElementById('upload-progress');
    var progressBar  = document.getElementById('upload-progress-bar');

    if (!fileInput.files || !fileInput.files[0]) {
      statusEl.textContent = 'Please select a video file first.';
      statusEl.className = 'error'; return;
    }
    if (!linkUrl) {
      statusEl.textContent = 'Please enter a click-through link URL.';
      statusEl.className = 'error'; return;
    }

    statusEl.textContent = 'Uploading... (large files may take a moment)';
    statusEl.className = '';
    progressWrap.style.display = 'block';
    progressBar.style.width = '0%';

    var formData = new FormData();
    formData.append('video',   fileInput.files[0]);
    formData.append('linkUrl', linkUrl);
    formData.append('caption', caption);
    formData.append('order',   order);

    // Use XMLHttpRequest for upload progress
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/videos');
    xhr.setRequestHeader('Authorization', 'Bearer ' + AdminAuth.token());

    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        var pct = Math.round(e.loaded / e.total * 100);
        progressBar.style.width = pct + '%';
        statusEl.textContent = 'Uploading... ' + pct + '%';
      }
    };

    xhr.onload = function() {
      progressWrap.style.display = 'none';
      try {
        var data = JSON.parse(xhr.responseText);
        if (xhr.status === 401) { AdminAuth.logout(); return; }
        if (data.success) {
          statusEl.textContent = 'Video uploaded successfully!';
          statusEl.className = 'success';
          fileInput.value = '';
          document.getElementById('video-link').value = '';
          document.getElementById('video-caption').value = '';
          document.getElementById('video-order').value = '0';
          loadVideos();
        } else {
          statusEl.textContent = 'Error: ' + (data.message || 'Upload failed');
          statusEl.className = 'error';
        }
      } catch(e) {
        statusEl.textContent = 'Upload failed.';
        statusEl.className = 'error';
      }
    };

    xhr.onerror = function() {
      progressWrap.style.display = 'none';
      statusEl.textContent = 'Upload failed. Please try again.';
      statusEl.className = 'error';
    };

    xhr.send(formData);
  }

  async function toggleVideo(id, currentActive) {
    try {
      await AdminAuth.apiFetch('/api/videos/' + id, { method: 'PUT', body: JSON.stringify({ isActive: !currentActive }) });
      loadVideos();
    } catch(e) { alert('Failed to update.'); }
  }

  async function deleteVideo(id) {
    if (!confirm('Delete this video permanently?')) return;
    try {
      await AdminAuth.apiFetch('/api/videos/' + id, { method: 'DELETE' });
      loadVideos();
    } catch(e) { alert('Failed to delete.'); }
  }

  async function loadVideos() {
    var grid = document.getElementById('vid-grid');
    var countEl = document.getElementById('video-count');
    grid.innerHTML = '<div class="empty-state">Loading...</div>';
    try {
      var data = await AdminAuth.apiFetch('/api/videos/all');
      if (!data.success || !data.videos.length) {
        grid.innerHTML = '<div class="empty-state">No videos yet. Upload your first video above!</div>';
        if (countEl) countEl.textContent = '0 videos';
        return;
      }
      if (countEl) countEl.textContent = data.videos.length + ' video' + (data.videos.length !== 1 ? 's' : '');
      grid.innerHTML = data.videos.map(function(v) {
        return '<div class="vid-card">'
          + (!v.isActive ? '<span class="vid-inactive-badge">HIDDEN</span>' : '')
          + '<video src="' + v.videoUrl + '" muted playsinline loop preload="metadata" style="cursor:pointer;" onclick="window.open(\'' + v.linkUrl + '\',\'_blank\')"></video>'
          + '<div class="vid-card-body">'
          + '<p>' + (v.caption || '<em style="color:#ccc;">No caption</em>') + '</p>'
          + '<p style="color:#aaa;font-size:10px;"><a href="' + v.linkUrl + '" target="_blank" style="color:#888;">Link ↗</a></p>'
          + '<p style="color:#bbb;font-size:10px;">Order: ' + v.order + '</p>'
          + '<div class="vid-card-actions">'
          + '<button class="btn btn-secondary btn-sm" onclick="toggleVideo(\'' + v._id + '\',' + v.isActive + ')">' + (v.isActive ? 'Hide' : 'Show') + '</button>'
          + '<button class="btn btn-sm" style="background:#e74c3c;color:#fff;border:none;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:1px;" onclick="deleteVideo(\'' + v._id + '\')">Delete</button>'
          + '</div></div></div>';
      }).join('');
    } catch(e) {
      grid.innerHTML = '<div class="empty-state">Failed to load videos.</div>';
    }
  }

  loadVideos();
</script>
<script src="admin-mobile.js"></script>
</body>
